name: Build Web Dist

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/build-web-dist.yml'
  workflow_dispatch:

# Add permissions for the workflow
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build web UI
        working-directory: ./web
        run: npm run build

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild web_dist [skip ci]"
          file_pattern: "hermes_cli/web_dist/**"
          skip_fetch: true
          skip_checkout: true
