name: Build Web Dist

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/build-web-dist.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build web UI
        working-directory: ./web
        run: npm run build

      - name: Check if web_dist changed
        id: check
        run: |
          if [ -d "hermes_cli/web_dist" ]; then
            # Check if the new build differs from current
            echo "web_dist exists, checking for changes..."
          fi
          
      - name: Commit and push web_dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the built web_dist
          git add hermes_cli/web_dist/
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to web_dist"
          else
            git commit -m "chore: rebuild web_dist [skip ci]"
            git push
          fi
