name: Build Web Dist

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/build-web-dist.yml'
  workflow_dispatch:

# Add permissions for the workflow
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build web UI
        working-directory: ./web
        run: npm run build

      - name: Commit web_dist with force-add
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Force add the ignored web_dist directory
          git add -f hermes_cli/web_dist/
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit (web_dist unchanged)"
          else
            echo "Committing web_dist..."
            git commit -m "chore: rebuild web_dist [skip ci]"
            git push origin HEAD:main
          fi
