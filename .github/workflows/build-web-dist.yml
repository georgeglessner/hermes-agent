name: Build Web Dist

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/build-web-dist.yml'
  workflow_dispatch:

# Add permissions for the workflow
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.github_token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build web UI
        working-directory: ./web
        run: npm run build

      - name: Check web_dist exists
        run: |
          echo "Checking hermes_cli/web_dist..."
          ls -la hermes_cli/web_dist/ 2>/dev/null || echo "Directory not found!"
          ls -la hermes_cli/web_dist/.vite/manifest.json 2>/dev/null || echo "Manifest not found!"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        run: |
          git add hermes_cli/web_dist/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rebuild web_dist [skip ci]"
            git push https://${{ github.token }}@github.com/${{ github.repository }}.git HEAD:main
          fi
