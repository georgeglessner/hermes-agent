name: Build Web Dist

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/build-web-dist.yml'
  workflow_dispatch:

# Add permissions for the workflow
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build web UI
        working-directory: ./web
        run: npm run build

      - name: Commit and push web_dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # List what was built
          echo "Contents of hermes_cli/web_dist:"
          ls -la hermes_cli/web_dist/
          
          # Stage the built web_dist
          git add hermes_cli/web_dist/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to web_dist"
          else
            echo "Changes detected, committing..."
            git commit -m "chore: rebuild web_dist [skip ci]"
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
